# Full-feature test configuration for the static test suite.
update=no
sysctl=yes
sysctl-strict=yes
kernel-params=yes
kernel-params-strict=yes
disable-ipv6=yes
firewall=yes
firewall-ssh=yes
time-sync=yes
disable-time-sync=no
apparmor=yes
apparmor-profiles=yes
linux-hardened=yes
bubblewrap=yes
bubblewrap-suid=no
chaotic-aur=yes
hardened-malloc=yes
hardened-malloc-global=yes
microcode=yes
restrict-su=yes
lock-root=yes
deny-root-ssh=yes
umask=yes
umask-value=077
coredumps=yes
usbguard=yes
usbguard-policy=yes
dma=yes
webcam=yes
microphone=yes
rfkill=yes
rfkill-wifi=yes
bluetooth=yes
mac=yes
mac-mode=random
hostname=yes
dhcp-hostname=yes
tor=yes
tor-pacman=yes
protocols=yes
filesystems=yes
reboot=no
